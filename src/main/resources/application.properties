spring.application.name=credvault

# ---- Database ----
# Development: an H2 database saved in the ./data folder (kept out of Git).
# Phase 5 adds a PostgreSQL profile for production-style runs.
spring.datasource.url=jdbc:h2:file:./data/credvault
spring.datasource.username=sa
spring.datasource.password=

# Create or update tables to match the entity classes
spring.jpa.hibernate.ddl-auto=update
# Database work happens only inside the service layer, never while a web page renders
spring.jpa.open-in-view=false

# ---- Sessions ----
# The unlocked data key lives in the session, so sessions are short-lived:
# after 15 minutes of inactivity the vault locks itself.
server.servlet.session.timeout=15m
# JavaScript can't read the session cookie (limits XSS), and it isn't sent
# on requests started from other websites (limits CSRF)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# Never save sessions (and so data keys) to disk when the server restarts
server.servlet.session.persistent=false

# ---- Error pages ----
# Never show stack traces or internal exception messages to users
server.error.include-stacktrace=never
server.error.include-message=never

# ---- Crypto ----
# PBKDF2 iterations for new accounts (OWASP recommendation). Do not lower this.
credvault.crypto.iterations=600000
