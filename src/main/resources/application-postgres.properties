# Production-style settings, used when the "postgres" profile is active:
#   SPRING_PROFILES_ACTIVE=postgres
#
# Connection details come from environment variables, never from this file.
# DB_PASSWORD deliberately has no default: if it isn't set, the app refuses
# to start instead of running with a guessable password.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/credvault}
spring.datasource.username=${DB_USER:credvault}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

# Set COOKIE_SECURE=true when serving over HTTPS, so the session cookie is
# never sent over an unencrypted connection
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
