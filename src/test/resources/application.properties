spring.application.name=credvault

# Tests use a throwaway in-memory database that starts empty every run
spring.datasource.url=jdbc:h2:mem:credvault-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Far fewer iterations so the tests run in seconds. Never use this outside tests.
credvault.crypto.iterations=1000
