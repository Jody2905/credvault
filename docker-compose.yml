# Runs CredVault with a PostgreSQL database.
#
#   1. Copy .env.example to .env and set a strong DB_PASSWORD
#   2. docker compose up --build
#   3. Open http://localhost:8080

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: credvault
      POSTGRES_USER: credvault
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in a .env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credvault -d credvault"]
      interval: 5s
      retries: 10
    # No "ports" section: the database is reachable only by the app,
    # inside Docker's private network, never from outside

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/credvault
      DB_USER: credvault
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"   # reachable only from this computer

volumes:
  pgdata:
